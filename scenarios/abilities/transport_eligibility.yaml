name: transports-cannot-carry-artillery-motorcycles-or-cavalry-except-light-artillery-and-gun-transports
source: "Advanced rulebook, Transport: transport Vehicles can't carry Soldiers with the subtypes Artillery, Motorcycle or Cavalry. Light Artillery: this unit can be carried by units with the transport ability. Gun Transport: can carry non-large Artillery. Light Towing: can transport units with Light Artillery. Heavy Transport: no restriction against carrying Artillery"
