name: flamethrower-ignores-cover-and-three-sixes-destroy-immediately
source: "Flamethrower: short-range attack ignores cover; three or more 6's at short range against a Soldier or Vehicle destroy the target immediately"
board: {width: 10, height: 8, terrain: {forest: [[5,4]]}}
units:
  - {id: flame, owner: player1, at: [4,4], stats: {unit_type: Soldier, defense: "4", speed: 1, per: [10,0,0], veh: [8,0,0], abilities: "Flamethrower"}}
  - {id: flame2, owner: player1, at: [4,3], stats: {unit_type: Soldier, defense: "4", speed: 1, per: [10,0,0], veh: [8,0,0], abilities: "Flamethrower"}}
