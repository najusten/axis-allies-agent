name: heavy-armor-ignores-the-first-damaged-counter-and-cannot-be-destroyed-in-one-attack
source: "Heavy Armor: ignore the first Damaged counter this unit receives each game. Official Q&A: with three hits the discarded Damaged counter makes the third hit the second, so the tank is damaged — 'Is it at all possible to destroy a unit with the Heavy Armor SA in one attack? No.' A later attack can still finish it"
