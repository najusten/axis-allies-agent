name: soldier-disrupted-then-destroyed
source: "Rulebook: a Soldier with a Disrupted counter is destroyed by a second hit result"
board: {width: 10, height: 10}
units:
  - {id: rifles, owner: player1, at: [5,5], stats: {unit_type: Soldier, defense: "4", per: [7,5,3]}}
  - {id: mg, owner: player2, at: [7,5], stats: {unit_type: Soldier, defense: "4", per: [10,8,6]}}
  - {id: mg2, owner: player2, at: [7,6], stats: {unit_type: Soldier, defense: "4", per: [10,8,6]}}
phase: assault
active_player: player2
# first attack: 8 dice, exactly 4 successes = defense 4 -> 1 hit (disrupted)
# second attack: again 4 successes -> disrupted again -> destroyed
dice: [6,6,6,6,1,1,1,1, 6,6,6,6,1,1,1,1]
actions:
  - {type: attack, unit: mg, target: rifles}
  - {type: attack, unit: mg2, target: rifles}
  - {type: casualty}
expect:
  units:
    rifles: {status: destroyed}
