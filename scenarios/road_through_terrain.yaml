name: a-road-through-difficult-terrain-costs-one-hex-and-needs-no-movement-roll
source: "Advanced rulebook, Roads: if a unit moves along a road each hex only counts as one hex even if the prevailing terrain is double cost, and it doesn't need to make movement rolls when moving along a road even if it crosses a stream or enters a forest. Cover and line of sight follow the base terrain"
board:
  width: 14
  height: 10
  terrain: {forest: [[5,3],[6,3]], town: [[5,6]]}
  roads: [[4,3],[5,3],[6,3],[7,3], [4,6],[5,6]]
  edge_obstacles:
    - {a: [4,3], b: [5,3], type: stream}
units:
  - {id: tank, owner: player1, at: [4,3], facing: SE, stats: {unit_type: Vehicle Tank, defense: "5/4", speed: 3, per: [6,4,2], veh: [6,4,2]}}
  - {id: gun, owner: player1, at: [2,6], stats: {unit_type: Soldier, defense: "4", per: [8,6,4], veh: [8,6,4]}}
  - {id: townie, owner: player2, at: [5,6], stats: {unit_type: Soldier, defense: "4", per: [5,3,1]}}
  - {id: far, owner: player2, at: [8,3], stats: {unit_type: Soldier, defense: "4", per: [5,3,1]}}
phase: movement
active_player: player1
dice: [6,6,6,6,1,1, 5]     # only the town cover roll should be rolled: no movement rolls along the road
actions:
  - {type: move, unit: tank, to: [7,3]}      # stream + two forest hexes, all along the road: no rolls, 3 hexes
  - {type: set_phase, phase: assault}
  - {type: attack, unit: gun, target: townie}   # a road through a town still gives town cover
expect:
  dice_consumed: 7
  no_events: [{type: movement_roll}]
  units:
    tank: {at: [7,3]}
  results:
    2: {success: true, combat: {cover_rolled: true, cover_roll: 5}}
  legal:
    - {type: attack, unit: gun, target: far, allowed: false}    # forest hexes with a road still block line of sight
