name: explicit-route-must-be-within-speed
source: "Player-chosen routes (waypoints) follow the same movement rules: a route around the forest costs the full speed but needs no roll"
board: {width: 10, height: 8, terrain: {forest: [[4,3]]}}
units:
  - {id: tank, owner: player1, at: [2,3], facing: SE, stats: {unit_type: Vehicle Tank, defense: "5/4", speed: 4, per: [8,6,4], veh: [6,4,2]}}
  - {id: enemy, owner: player2, at: [9,3], stats: {unit_type: Soldier, defense: "4", per: [5,3,1]}}
phase: movement
active_player: player1
dice: [2]                    # the forest roll on the direct route would fail...
actions:
  - {type: move, unit: tank, to: [5,3], path: [[2,3],[3,2],[4,2],[5,2],[5,3]]}   # ...but the chosen route goes around the forest
expect:
  dice_consumed: 0
  units:
    tank: {at: [5,3]}
