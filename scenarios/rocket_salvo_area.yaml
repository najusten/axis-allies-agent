# a: 10 dice all 6 -> 10 successes vs def 4 -> 3 hits (destroyed)
# b: 10 dice, exactly 4 successes -> 1 hit (disrupted)
dice: [6,6,6,6,6,6,6,6,6,6, 6,6,6,6,1,1,1,1,1,1]
actions:
  - {type: attack, unit: neb, target: a, special: rocket_salvo}
  - {type: casualty}
expect:
  dice_consumed: 20
  units:
    a: {status: destroyed}
    b: {status: disrupted, alive: true}
