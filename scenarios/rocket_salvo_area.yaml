name: rocket-salvo-hits-target-and-adjacent
source: "Rocket Salvo ability text: once per game, 10 dice vs each Soldier / 5 vs each Vehicle in the target hex and all adjacent hexes, friend or foe"
board: {width: 10, height: 10}
units:
  - {id: neb, owner: player2, at: [2,5], stats: {unit_type: Soldier, defense: "3", per: [4,4,4], veh: [2,2,2], abilities: "Rocket Salvo, Blast"}}
  - {id: a, owner: player1, at: [6,5], stats: {unit_type: Soldier, defense: "4", per: [7,5,3]}}
  - {id: b, owner: player1, at: [7,5], stats: {unit_type: Soldier, defense: "4", per: [7,5,3]}}
  - {id: far, owner: player1, at: [9,5], stats: {unit_type: Soldier, defense: "4", per: [7,5,3]}}
phase: assault
