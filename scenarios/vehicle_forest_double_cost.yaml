  - {id: rifles, owner: player1, at: [2,2], stats: {unit_type: Soldier, defense: "4", speed: 2, per: [7,5,3]}}
  - {id: enemy, owner: player2, at: [9,0], stats: {unit_type: Soldier, defense: "4", per: [7,5,3]}}
